<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passports & Postcards Travel Design</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f7f5f2;
      color: #333;
      text-align: center;
    }

    .hero {
      padding: 80px 25px;
      background: #ffffff;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    h2 {
      font-weight: normal;
      font-size: 20px;
    }

    .card {
      background: white;
      max-width: 600px;
      margin: 30px auto;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .footer {
      margin: 40px 0;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="hero">
    <h1>Passports & Postcards</h1>
    <h2>Travel Design</h2>
  </div>

  <div class="card">
    <h2>Your Vacation Quote</h2>
    <p>This is our first test quote page.</p>
    <p>If you can see this page, our new travel quote website is working!</p>
  </div>

  <div class="footer">
    Passports & Postcards Travel Design
  </div>

</body>
</html>
